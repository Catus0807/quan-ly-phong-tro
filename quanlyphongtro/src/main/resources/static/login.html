<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập & Đăng ký - Trọ Xanh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { width: 100%; max-width: 450px; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); background: white; }
        .login-card h3 { font-weight: bold; color: #198754; text-align: center; margin-bottom: 25px; }
        .nav-tabs .nav-link { color: #495057; font-weight: 500; }
        .nav-tabs .nav-link.active { font-weight: bold; color: #198754; border-bottom: 3px solid #198754; }
    </style>
</head>
<body>
<div class="login-card">
    <h3>🏠 TRỌ XANH</h3>
    
    <!-- Tabs Đăng nhập / Đăng ký -->
    <ul class="nav nav-tabs nav-fill mb-4" id="authTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane" type="button">ĐĂNG NHẬP</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-pane" type="button">ĐĂNG KÝ CHỦ TRỌ</button>
        </li>
    </ul>

    <div class="tab-content" id="authTabsContent">
        <!-- FORM ĐĂNG NHẬP -->
        <div class="tab-pane fade show active" id="login-pane">
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label fw-bold">Tài khoản (Tên đăng nhập / SĐT)</label>
                    <input type="text" id="username" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Mật khẩu</label>
                    <div class="input-group">
                        <input type="password" id="password" class="form-control" required>
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password', 'loginEye')">
                            <i class="bi bi-eye" id="loginEye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold">ĐĂNG NHẬP</button>
            </form>
        </div>

        <!-- FORM ĐĂNG KÝ -->
        <div class="tab-pane fade" id="register-pane">
            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label fw-bold">Tên đăng nhập <span class="text-danger">*</span></label>
                    <input type="text" id="regUsername" class="form-control" required>
                    <div class="invalid-feedback" id="errRegUsername">Tên đăng nhập đã tồn tại!</div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Mật khẩu <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <input type="password" id="regPassword" class="form-control" required>
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('regPassword', 'regEye')">
                            <i class="bi bi-eye" id="regEye"></i>
                        </button>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Họ và tên <span class="text-danger">*</span></label>
                    <input type="text" id="regHoTen" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Email <span class="text-danger">*</span></label>
                    <input type="email" id="regEmail" class="form-control" placeholder="Để nhận thông báo kích hoạt" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold">Điện thoại</label>
                        <input type="text" id="regSdt" class="form-control" oninput="locKyTuSo(this, 10)">
                        <div class="invalid-feedback">SĐT phải có đúng 10 số!</div>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold">CCCD</label>
                        <input type="text" id="regCccd" class="form-control" oninput="locKyTuSo(this, 12)">
                        <div class="invalid-feedback">CCCD phải có đúng 12 số!</div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">TẠO TÀI KHOẢN</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = 'http://localhost:8080/api/auth';

    // Mắt mật khẩu & Validate
    function togglePassword(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.type === "password") {
            input.type = "text";
            icon.classList.replace("bi-eye", "bi-eye-slash");
        } else {
            input.type = "password";
            icon.classList.replace("bi-eye-slash", "bi-eye");
        }
    }

    // Lọc ký tự số và xóa viền đỏ khi nhập đủ
    function locKyTuSo(input, maxLength) {
        input.value = input.value.replace(/[^0-9]/g, ''); 
        if (input.value.length > maxLength) {
            input.value = input.value.slice(0, maxLength);
        }
        if (input.value.length === maxLength) {
            input.classList.remove('is-invalid');
            input.classList.add('is-valid');
        } else {
            input.classList.remove('is-valid');
        }
    }

    // Bắt lỗi khi di chuột ra khỏi ô (Blur)
    document.getElementById('regSdt').addEventListener('blur', function() {
        if (this.value && this.value.length !== 10) this.classList.add('is-invalid');
    });

    document.getElementById('regCccd').addEventListener('blur', function() {
        if (this.value && this.value.length !== 12) this.classList.add('is-invalid');
    });

    // KIỂM TRA TÊN ĐĂNG NHẬP REAL-TIME 
    let typingTimer;
    const doneTypingInterval = 500; // Đợi 0.5 giây sau khi ngừng gõ
    const regUsernameInput = document.getElementById('regUsername');

    regUsernameInput.addEventListener('input', function() {
        // Xóa bộ đếm cũ nếu người dùng vẫn đang tiếp tục gõ
        clearTimeout(typingTimer);
        const username = this.value.trim();

        // Nếu ô trống thì bỏ qua, xóa hết viền màu
        if (!username) {
            this.classList.remove('is-valid', 'is-invalid');
            return;
        }

        // Bắt đầu đếm ngược, nếu người dùng dừng tay 0.5s thì gọi API
        typingTimer = setTimeout(() => {
            fetch(`${API_URL}/check-username?username=${encodeURIComponent(username)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.exists) {
                        // Tên đã tồn tại -> Báo viền đỏ
                        regUsernameInput.classList.remove('is-valid');
                        regUsernameInput.classList.add('is-invalid');
                    } else {
                        // Tên hợp lệ -> Báo viền xanh
                        regUsernameInput.classList.remove('is-invalid');
                        regUsernameInput.classList.add('is-valid');
                    }
                })
                .catch(err => console.error(err));
        }, doneTypingInterval);
    });

    // XỬ LÝ SUBMIT FORM    
    // Đăng nhập
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const data = {
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value.trim()
        };
        
        fetch(`${API_URL}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(async res => {
            if (res.ok) {
                const result = await res.json();
                localStorage.setItem('userRole', result.role); 
                
                if (result.role === 'SUPER_ADMIN') {
                    window.location.href = result.redirect; 
                    return; 
                }
                
                if (result.role === 'ADMIN') {
                    localStorage.setItem('chuTroId', result.chuTroId);
                    localStorage.setItem('adminUsername', result.username); 
                } else if (result.role === 'USER') {
                    localStorage.setItem('khachId', result.khachId);
                    localStorage.setItem('tenKhach', result.tenKhach);
                }
                window.location.href = result.redirect; 
            } else {
                alert("Lỗi: " + await res.text());
            }
        })
        .catch(err => console.error("Lỗi mạng:", err));
    });

    // Đăng ký
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Quét lỗi trước khi gửi
        const errEls = this.querySelectorAll('.is-invalid');
        if (errEls.length > 0) {
            alert("Vui lòng kiểm tra lại các trường báo lỗi màu đỏ!");
            return;
        }

        const data = {
            tenDangNhap: document.getElementById('regUsername').value.trim(),
            matKhau: document.getElementById('regPassword').value.trim(),
            hoTen: document.getElementById('regHoTen').value.trim(),
            email: document.getElementById('regEmail').value.trim(),
            sdt: document.getElementById('regSdt').value.trim(),
            cccd: document.getElementById('regCccd').value.trim()
        };

        fetch(`${API_URL}/dang-ky`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(async res => {
            if (res.ok) {
                alert("🎉 Đăng ký thành công!\n\nTài khoản của bạn đang ở trạng thái CHỜ DUYỆT. Ban quản trị hệ thống sẽ gửi Email thông báo cho bạn ngay khi tài khoản được kích hoạt.");
                
                // Reset form và xóa các viền xanh (is-valid)
                this.reset();
                this.querySelectorAll('.is-valid').forEach(el => el.classList.remove('is-valid'));
                
                document.getElementById('login-tab').click(); 
            } else {
                alert("Lỗi: " + await res.text());
            }
        })
        .catch(err => console.error("Lỗi mạng:", err));
    });
</script>
</body>
</html>
