<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản trị hệ thống - Trọ Xanh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f7f6; }
        .navbar { background-color: #198754; }
        .table-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<nav class="navbar navbar-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1"><i class="bi bi-shield-lock-fill"></i> HỆ THỐNG QUẢN TRỊ - TRỌ XANH</span>
        <button class="btn btn-outline-light btn-sm" onclick="dangXuat()">Đăng xuất</button>
    </div>
</nav>

<div class="container">
    <div class="table-card">
        <h4 class="mb-4 text-success fw-bold">Danh sách Chủ trọ đăng ký</h4>
        <!-- ĐÃ THÊM: Thanh tìm kiếm và bộ lọc -->
        <div class="row mb-3">
            <div class="col-md-8 mb-2">
                <input type="text" id="searchInput" class="form-control" placeholder="🔍 Tìm kiếm theo tên, SĐT, CCCD, Email, Tên đăng nhập..." onkeyup="filterAndSort()">
            </div>
            <div class="col-md-4">
                <select id="sortInput" class="form-select" onchange="filterAndSort()">
                    <option value="newest">Mới nhất (Thêm sau)</option>
                    <option value="oldest">Cũ nhất (Thêm trước)</option>
                </select>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th class="text-center">STT</th>
                        <th>Họ và tên</th>
                        <th>Tên đăng nhập</th>
                        <th>Email</th> 
                        <th>Điện thoại</th>
                        <th>CCCD</th>
                        <th>Địa chỉ</th>
                        <th class="text-center">Trạng thái</th>
                        <th class="text-center">Hành động</th>
                    </tr>
                </thead>
                <tbody id="tableQuanTriBody">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/quan-tri.js"></script> 
</body>
</html>
